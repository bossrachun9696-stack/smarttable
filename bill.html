<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FBF6EE">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="SmartTable">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>เช็กบิล · SmartTable</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet"></noscript>
  <link rel="stylesheet" href="css/st-style.css">
</head>
<body>
<main class="st-page">
  <div class="st-top">
    <a id="back" href="home.html" class="st-chip">‹ ผังโต๊ะ</a>
    <span id="b-time" class="st-badge"></span>
  </div>
  <h1 class="st-title" id="b-title">เช็กบิล</h1>
  <p id="b-sub" class="st-sub">กำลังโหลด…</p>

  <div id="st-msg" class="st-msg" role="status" hidden></div>

  <div id="b-body" hidden>
    <div id="b-warn" class="st-msg st-msg--error" hidden></div>

    <!-- ลูกค้าแนบสลิปพร้อมเพย์ รอตรวจ -->
    <div id="b-buffet" class="st-bf-panel" hidden></div>
    <section id="b-req" class="st-card st-card--alert" hidden></section>

    <!-- ใบที่จ่ายไปแล้วในรอบนี้ (แยกบิล) -->
    <section id="b-parts" class="st-card" hidden></section>

    <section class="st-card">
      <h3>เก็บเงินแบบไหน</h3>
      <div id="b-split" class="st-seg st-seg--3" role="tablist">
        <button type="button" data-s="all">ทั้งหมด</button>
        <button type="button" data-s="equal">หารเท่ากัน</button>
        <button type="button" data-s="items">เลือกรายการ</button>
      </div>
      <div data-split="equal" hidden>
        <div class="st-split-n">
          <span>หารกี่คน <small>(คนที่ยังไม่จ่าย)</small></span>
          <div class="st-qty st-qty--sm">
            <button type="button" data-n="-1" aria-label="ลด">−</button><b id="b-n">2</b><button type="button" data-n="1" aria-label="เพิ่ม">+</button>
          </div>
        </div>
        <p id="b-equal-note" class="st-sub"></p>
      </div>
      <p data-split="items" class="st-sub" hidden>แตะ + เพื่อเลือกรายการที่คนนี้จ่าย</p>
      <div id="b-items"></div>
    </section>

    <section class="st-card">
      <div id="b-disc-wrap">
        <div class="st-field"><span>ส่วนลด (เฉพาะใบนี้)</span>
          <div class="st-disc-row">
            <input id="b-disc" type="number" min="0" step="1" inputmode="decimal" placeholder="0">
            <div id="b-unit" class="st-unit" role="tablist">
              <button type="button" data-u="baht" aria-selected="true">฿</button>
              <button type="button" data-u="pct" aria-selected="false">%</button>
            </div>
          </div>
        </div>
        <div class="st-disc-row" style="margin-bottom:12px">
          <input id="b-coupon" type="text" maxlength="20" placeholder="โค้ดคูปอง" autocapitalize="characters" style="text-transform:uppercase">
          <button id="b-coupon-apply" class="st-chip" type="button">ใช้คูปอง</button>
        </div>
        <div id="b-coupon-on" class="st-coupon-on" hidden></div>
        <div id="b-coupon-guest" class="st-coupon-guest" hidden></div>
      </div>
      <div id="b-bill" class="st-bill st-bill--flat"></div>
    </section>

    <section class="st-card">
      <div class="st-row-between">
        <h3 style="margin:0">วิธีชำระ</h3>
        <label class="st-switch-label"><input id="b-multi" type="checkbox"> หลายช่องทาง</label>
      </div>
      <div id="b-methods" class="st-seg" role="tablist" style="margin-top:10px">
        <button type="button" data-m="cash">💵 เงินสด</button>
        <button type="button" data-m="promptpay">📱 พร้อมเพย์</button>
        <button type="button" data-m="transfer">🏦 โอน</button>
        <button type="button" data-m="card">💳 บัตร</button>
      </div>
      <div id="b-tenders" class="st-tenders" hidden></div>

      <div data-panel="cash">
        <label class="st-field"><span>รับเงินมา (บาท)</span>
          <input id="b-recv" type="number" min="0" step="1" inputmode="decimal">
        </label>
        <div id="b-quick" class="st-quick"></div>
        <div class="st-change"><span>เงินทอน</span><b id="b-change">฿0</b></div>
      </div>

      <div data-panel="promptpay" hidden>
        <div id="b-pp"></div>
      </div>

      <div data-panel="slip" hidden>
        <div class="st-photo">
          <div id="slip-preview" class="st-photo-box">ไม่บังคับ</div>
          <div class="st-photo-actions">
            <label class="st-chip">ถ่าย / แนบสลิป
              <input id="slip-input" type="file" accept="image/*" hidden>
            </label>
            <button id="slip-remove" class="st-chip" type="button" hidden>ลบรูป</button>
            <small>เก็บไว้ตรวจย้อนหลัง (เห็นเฉพาะพนักงาน)</small>
          </div>
        </div>
      </div>

      <label class="st-field"><span>หมายเหตุ (ไม่บังคับ)</span>
        <input id="b-note" type="text" maxlength="200" placeholder="เช่น ลูกค้าประจำ">
      </label>
      <button id="b-pay" class="st-btn" type="button">รับเงิน</button>
    </section>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/st-config.js"></script>
<script src="js/st-auth.js"></script>
<script src="js/st-qr.js"></script>
<script src="js/st-promptpay.js"></script>
<script src="js/st-bill.js"></script>
</body>
</html>
