<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FBF6EE">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="SmartTable">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>ร้านของฉัน · SmartTable</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet"></noscript>
  <link rel="stylesheet" href="css/st-style.css">
</head>
<body>
<main class="st-page">
  <div class="st-top">
    <div class="st-brand">
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <rect width="48" height="48" rx="14" fill="#E4572E"/>
        <circle cx="24" cy="25" r="11" fill="#fff"/>
        <circle cx="24" cy="25" r="6.5" fill="none" stroke="#E4572E" stroke-width="2"/>
        <rect x="9" y="8" width="7" height="7" rx="1.5" fill="#fff"/>
        <rect x="32" y="8" width="7" height="7" rx="1.5" fill="#fff"/>
      </svg>
      <h1>SmartTable</h1>
    </div>
    <a id="btn-settings" class="st-chip" href="settings.html">⚙️ ตั้งค่า</a>
  </div>

  <div id="st-msg" class="st-msg" role="status" hidden></div>

  <!-- ติดตั้งเป็นแอป -->
  <section id="pwa-card" class="st-card st-pwa" hidden>
    <img src="icons/st-192.png" alt="" width="52" height="52">
    <div class="st-pwa-main">
      <b>ติดตั้ง SmartTable บนมือถือ</b>
      <small id="pwa-text">เปิดจากไอคอนบนหน้าจอได้เลย เต็มจอเหมือนแอป</small>
      <div class="st-pwa-actions">
        <button id="pwa-install" class="st-btn st-btn--sm" type="button" hidden>📲 ติดตั้ง</button>
        <button id="pwa-close" class="st-chip" type="button">ไว้ทีหลัง</button>
      </div>
    </div>
  </section>

  <section class="st-card">
    <div class="st-me">
      <div id="avatar" class="st-avatar">·</div>
      <div style="flex:1;min-width:0"><h2 id="hello">กำลังโหลด…</h2><p id="email"></p></div>
      <a class="st-chip" href="settings.html">แก้โปรไฟล์</a>
    </div>
  </section>

  <!-- คำเชิญเข้าร้านที่ส่งถึงฉัน (ด้วยไอดี หรืออีเมล) -->
  <section id="my-invites" class="st-card st-card--alert" hidden></section>

  <div id="home-body" hidden>
    <h2 class="st-h">ร้านของฉัน</h2>
    <div id="shop-list" class="st-list"></div>

    <section class="st-card">
      <h3>สร้างร้านใหม่</h3>
      <form id="form-shop" novalidate>
        <label class="st-field"><span>ชื่อร้าน</span>
          <input name="shop_name" type="text" maxlength="80" required placeholder="เช่น ครัวป้าแดง">
        </label>
        <label class="st-field"><span>ชื่อลิงก์ร้าน (ภาษาอังกฤษ)</span>
          <input name="slug" type="text" maxlength="40" required autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="เช่น pa-daeng">
          <small id="slug-status">ใช้ a-z, 0-9 และ - อย่างน้อย 3 ตัว ใช้เป็นชื่อร้านในลิงก์ เปลี่ยนภายหลังไม่ได้</small>
        </label>
        <button class="st-btn" type="submit">สร้างร้าน</button>
      </form>
    </section>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/st-config.js"></script>
<script src="js/st-auth.js"></script>
<script src="js/st-home.js"></script>
<script src="js/st-pwa.js"></script>
</body>
</html>
