<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FBF6EE">
  <title>SmartTable</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/st-style.css">
</head>
<body>
<main class="st-auth">
  <div class="st-top">
    <div class="st-brand">
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <rect width="48" height="48" rx="14" fill="#E4572E"/>
        <circle cx="24" cy="25" r="11" fill="#fff"/>
        <circle cx="24" cy="25" r="6.5" fill="none" stroke="#E4572E" stroke-width="2"/>
        <rect x="9" y="8" width="7" height="7" rx="1.5" fill="#fff"/>
        <rect x="32" y="8" width="7" height="7" rx="1.5" fill="#fff"/>
      </svg>
      <h1>SmartTable</h1>
    </div>
    <button id="btn-logout" class="st-chip" type="button">ออกจากระบบ</button>
  </div>

  <section class="st-card">
    <div id="st-msg" class="st-msg" role="status" hidden></div>
    <div class="st-me">
      <div id="avatar" class="st-avatar">·</div>
      <div><h2 id="hello">กำลังโหลด…</h2><p id="email"></p></div>
    </div>

    <div id="home-body" hidden>
      <form id="form-name" novalidate>
        <label class="st-field"><span>ชื่อที่แสดง</span>
          <input name="display_name" type="text" maxlength="60" placeholder="ชื่อของคุณ">
        </label>
        <button class="st-btn st-btn--ghost" type="submit">บันทึกชื่อ</button>
      </form>
      <div class="st-next"><b>ขั้นต่อไป:</b> สร้างร้าน · เพิ่มเมนู · ตั้งโต๊ะและพิมพ์ QR</div>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/st-config.js"></script>
<script src="js/st-auth.js"></script>
<script src="js/st-home.js"></script>
</body>
</html>
