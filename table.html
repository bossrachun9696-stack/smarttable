<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FBF6EE">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <title>เมนู · SmartTable</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/st-style.css">
</head>
<body>
<main class="st-page st-guest">
  <div id="g-cover" class="st-cover" hidden></div>
  <header class="st-guest-head">
    <img id="g-logo" class="st-glogo" alt="" hidden>
    <div style="flex:1;min-width:0">
      <h1 id="g-shop">กำลังโหลด…</h1>
      <p id="g-sub"></p>
    </div>
    <span id="g-table" class="st-table-badge" hidden></span>
  </header>
  <nav id="g-lang" class="st-lang" hidden aria-label="Language"></nav>

  <div id="g-staff" class="st-staff-banner" hidden></div>
  <div id="st-msg" class="st-msg" role="status" hidden></div>
  <div id="g-state" class="st-state" hidden></div>
  <a id="g-mine" class="st-mine" hidden></a>
  <div id="g-ticket" class="st-ticket" hidden></div>

  <div id="g-actions" class="st-guest-actions" hidden>
    <button type="button" data-call="call">🙋 เรียกพนักงาน</button>
    <button type="button" id="btn-orders">🧾 ที่สั่งแล้ว <span id="orders-count"></span></button>
    <button type="button" data-call="bill">💳 ขอเช็กบิล</button>
  </div>
  <div id="g-pay" class="st-paycard" hidden></div>
  <div id="g-rate" class="st-rate" hidden></div>

  <div id="g-menu" hidden>
    <div class="st-guest-tools">
      <input id="g-search" type="search" placeholder="ค้นหาเมนู" autocomplete="off">
      <nav id="g-cats" class="st-cats"></nav>
      <nav id="g-diet" class="st-cats st-diet" hidden aria-label="กรองตามป้ายอาหาร"></nav>
    </div>
    <div id="g-items"></div>
    <p class="st-center st-sub" style="margin-top:24px">SmartTable</p>
  </div>
</main>

<div id="cart-bar" class="st-cart-bar" hidden>
  <button id="btn-cart" type="button">
    <span id="cart-n" class="st-cart-n">0</span>
    <span id="cart-label">ดูตะกร้า</span>
    <b id="cart-total"></b>
  </button>
</div>
<div id="toast" class="st-toast" role="status" hidden></div>

<div id="sheet" class="st-sheet st-sheet--bottom" hidden>
  <div class="st-sheet-panel st-split" role="dialog" aria-modal="true">
    <div class="st-sheet-head">
      <b id="sheet-title"></b>
      <button id="sheet-close" class="st-chip" type="button">ปิด</button>
    </div>
    <div class="st-sheet-scroll">
    <div id="sheet-msg" class="st-msg" role="status" hidden></div>
    <div id="sheet-body"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/st-config.js"></script>
<script src="js/st-auth.js"></script>
<script src="js/st-i18n.js"></script>
<script src="js/st-qr.js"></script>
<script src="js/st-promptpay.js"></script>
<script src="js/st-table.js"></script>
</body>
</html>
