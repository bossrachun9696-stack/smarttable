<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <title>ใบเสร็จ · SmartTable</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet"></noscript>
  <link rel="stylesheet" href="css/st-style.css">
  <link rel="stylesheet" href="css/st-receipt.css">
  <style>
    @page { size: auto; margin: 10mm; }
    @media print { .st-rc { width: 80mm; margin: 0 auto; } }
  </style>
</head>
<body class="st-rc-body st-er-body">
<div class="st-print-bar no-print">
  <a id="back" href="#" class="st-chip" hidden>‹ กลับ</a>
  <span id="er-eco" class="st-er-eco">🌱 ใบเสร็จดิจิทัล</span>
  <span></span>
</div>
<div id="st-msg" class="st-msg no-print" role="status" hidden></div>

<div id="er-logo-wrap" class="st-er-logo no-print" hidden><img id="er-logo" alt=""></div>
<article id="rc" class="st-rc" hidden></article>

<div class="st-rc-actions no-print" id="rc-actions" hidden>
  <button id="btn-img" class="st-btn" type="button">📸 บันทึกเป็นรูป</button>
  <button id="btn-pdf" class="st-btn st-btn--ghost" type="button">🖨 PDF / พิมพ์</button>
  <button id="btn-share" class="st-btn st-btn--ghost" type="button">📤 แชร์ลิงก์</button>
  <p id="er-exp" class="st-sub st-er-exp"></p>
</div>

<div id="er-img" class="st-er-imgbox no-print" hidden>
  <div class="st-er-imgpanel">
    <p id="er-img-hint" class="st-sub"></p>
    <img id="er-img-el" alt="">
    <button id="er-img-close" class="st-btn st-btn--ghost" type="button">ปิด</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/st-config.js"></script>
<script src="js/st-auth.js"></script>
<script src="js/st-i18n.js"></script>
<script src="js/st-printer.js"></script>
<script src="js/st-ereceipt.js"></script>
</body>
</html>
