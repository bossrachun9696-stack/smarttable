<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FBF6EE">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="SmartTable">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>โต๊ะและ QR · SmartTable</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/st-style.css">
</head>
<body>
<main class="st-page">
  <div class="st-top">
    <a id="back" href="home.html" class="st-chip">‹ ร้าน</a>
    <span id="my-role" class="st-badge"></span>
  </div>
  <h1 class="st-title">โต๊ะและ QR</h1>
  <p id="shop-sub" class="st-sub">กำลังโหลด…</p>

  <div id="st-msg" class="st-msg" role="status" hidden></div>

  <div id="tables-body" hidden>
    <div id="mode-banner" class="st-banner"></div>
    <div id="calls" class="st-calls"></div>

    <div class="st-legend">
      <span><i class="st-dot"></i>ว่าง</span>
      <span><i class="st-dot st-dot--open"></i>มีลูกค้า</span>
      <span><i class="st-dot st-dot--billing"></i>รอเช็กบิล</span>
      <a id="link-orders" class="st-chip" href="#">ออร์เดอร์ ›</a>
      <button id="btn-refresh" class="st-chip" type="button">รีเฟรช</button>
    </div>
    <div id="board"></div>

    <!-- จัดการโต๊ะ (เจ้าของ / ผู้จัดการ) -->
    <section id="manage" class="st-card" hidden>
      <h3>จัดการโต๊ะ</h3>
      <div class="st-grid2">
        <button id="btn-new" class="st-btn st-btn--ghost" type="button">+ เพิ่มโต๊ะ</button>
        <a id="btn-print" class="st-btn st-btn-link" href="#">พิมพ์ QR ทั้งหมด</a>
      </div>

      <h4>เพิ่มหลายโต๊ะพร้อมกัน</h4>
      <form id="form-many" novalidate>
        <div class="st-grid2">
          <label class="st-field"><span>ตั้งแต่เลข</span>
            <input name="from" type="number" min="0" inputmode="numeric" value="1"></label>
          <label class="st-field"><span>ถึงเลข</span>
            <input name="to" type="number" min="0" inputmode="numeric" value="10"></label>
        </div>
        <div class="st-grid2">
          <label class="st-field"><span>คำนำหน้า (ไม่บังคับ)</span>
            <input name="prefix" type="text" maxlength="10" placeholder="เช่น A → A1, A2"></label>
          <label class="st-field"><span>โซน (ไม่บังคับ)</span>
            <input name="zone" type="text" maxlength="40" placeholder="เช่น ในร้าน"></label>
        </div>
        <button class="st-btn st-btn--ghost" type="submit">เพิ่มโต๊ะ</button>
      </form>

      <h4>โต๊ะทั้งหมด <small id="table-count" class="st-sub"></small></h4>
      <div id="table-list"></div>
    </section>
  </div>
</main>

<!-- แผ่นด้านล่าง: จัดการโต๊ะ / แก้ไขโต๊ะ / แสดง QR -->
<div id="sheet" class="st-sheet st-sheet--bottom" hidden>
  <div class="st-sheet-panel" role="dialog" aria-modal="true">
    <div class="st-sheet-head">
      <b id="sheet-title"></b>
      <button id="sheet-close" class="st-chip" type="button">ปิด</button>
    </div>
    <div id="sheet-msg" class="st-msg" role="status" hidden></div>
    <div id="sheet-body"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/st-config.js"></script>
<script src="js/st-auth.js"></script>
<script src="js/st-qr.js"></script>
<script src="js/st-tables.js"></script>
</body>
</html>
