<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ใบเสร็จ · SmartTable</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/st-style.css">
  <link rel="stylesheet" href="css/st-receipt.css">
</head>
<body class="st-rc-body">
<div class="st-print-bar no-print">
  <a id="back" href="home.html" class="st-chip">‹ ผังโต๊ะ</a>
  <span></span>
  <button id="btn-print" class="st-chip st-chip--accent" type="button">พิมพ์ใบเสร็จ</button>
</div>
<div id="st-msg" class="st-msg no-print" role="status" hidden></div>
<div id="done" class="st-rc-done no-print" hidden></div>

<article id="rc" class="st-rc" hidden></article>

<div class="st-rc-actions no-print" id="rc-actions" hidden>
  <button id="btn-slip" class="st-btn st-btn--ghost" type="button" hidden>ดูรูปสลิป</button>
  <a id="btn-list" class="st-btn st-btn--ghost st-btn-link" href="#">ใบเสร็จทั้งหมด</a>
  <button id="btn-void" class="st-btn st-btn--ghost st-danger" type="button" hidden>ยกเลิกใบเสร็จนี้</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/st-config.js"></script>
<script src="js/st-auth.js"></script>
<script src="js/st-receipt.js"></script>
</body>
</html>
