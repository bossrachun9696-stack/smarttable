<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FBF6EE">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="SmartTable">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>SmartTable · เข้าสู่ระบบ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/st-style.css">
</head>
<body>
<main class="st-auth">
  <header class="st-brand">
    <svg viewBox="0 0 48 48" aria-hidden="true">
      <rect width="48" height="48" rx="14" fill="#E4572E"/>
      <circle cx="24" cy="25" r="11" fill="#fff"/>
      <circle cx="24" cy="25" r="6.5" fill="none" stroke="#E4572E" stroke-width="2"/>
      <rect x="9" y="8" width="7" height="7" rx="1.5" fill="#fff"/>
      <rect x="32" y="8" width="7" height="7" rx="1.5" fill="#fff"/>
    </svg>
    <div>
      <h1>SmartTable</h1>
      <p>สั่งอาหารจากโต๊ะ ง่ายแค่สแกน</p>
    </div>
  </header>

  <section class="st-card">
    <div class="st-tabs" role="tablist">
      <button type="button" data-view="login" role="tab">เข้าสู่ระบบ</button>
      <button type="button" data-view="signup" role="tab">สมัครสมาชิก</button>
    </div>

    <div id="st-msg" class="st-msg" role="status" hidden></div>

    <!-- เข้าสู่ระบบ -->
    <form id="form-login" data-view="login" novalidate>
      <label class="st-field"><span>อีเมล</span>
        <input name="email" type="email" autocomplete="email" inputmode="email" required placeholder="you@example.com">
      </label>
      <label class="st-field"><span>รหัสผ่าน</span>
        <div class="st-input">
          <input name="password" type="password" autocomplete="current-password" required placeholder="รหัสผ่าน">
          <button type="button" data-eye>แสดง</button>
        </div>
      </label>
      <div class="st-row"><a class="st-link" href="#forgot">ลืมรหัสผ่าน?</a></div>
      <button class="st-btn" type="submit">เข้าสู่ระบบ</button>
    </form>

    <!-- สมัครสมาชิก -->
    <form id="form-signup" data-view="signup" hidden novalidate>
      <label class="st-field"><span>ชื่อที่แสดง</span>
        <input name="display_name" type="text" autocomplete="name" maxlength="60" required placeholder="เช่น ร้านป้าแดง หรือ ชื่อของคุณ">
      </label>
      <label class="st-field"><span>อีเมล</span>
        <input name="email" type="email" autocomplete="email" inputmode="email" required placeholder="you@example.com">
      </label>
      <label class="st-field"><span>รหัสผ่าน</span>
        <div class="st-input">
          <input name="password" type="password" autocomplete="new-password" minlength="8" required placeholder="อย่างน้อย 8 ตัว">
          <button type="button" data-eye>แสดง</button>
        </div>
      </label>
      <label class="st-field"><span>ยืนยันรหัสผ่าน</span>
        <div class="st-input">
          <input name="password2" type="password" autocomplete="new-password" minlength="8" required placeholder="พิมพ์รหัสผ่านอีกครั้ง">
          <button type="button" data-eye>แสดง</button>
        </div>
      </label>
      <button class="st-btn" type="submit">สมัครสมาชิก</button>
    </form>

    <!-- ลืมรหัสผ่าน -->
    <form id="form-forgot" data-view="forgot" hidden novalidate>
      <h2>ลืมรหัสผ่าน</h2>
      <p class="st-sub">กรอกอีเมลที่ใช้สมัคร เราจะส่งลิงก์สำหรับตั้งรหัสผ่านใหม่ไปให้</p>
      <label class="st-field"><span>อีเมล</span>
        <input name="email" type="email" autocomplete="email" inputmode="email" required placeholder="you@example.com">
      </label>
      <button class="st-btn" type="submit">ส่งลิงก์ตั้งรหัสผ่านใหม่</button>
      <p class="st-center"><a class="st-link" href="#login">← กลับไปเข้าสู่ระบบ</a></p>
    </form>
  </section>

  <p class="st-foot">สำหรับเจ้าของร้านและพนักงาน<br>ลูกค้าสแกน QR ที่โต๊ะเพื่อสั่งอาหารได้เลย ไม่ต้องสมัคร</p>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/st-config.js"></script>
<script src="js/st-auth.js"></script>
<script src="js/st-login.js"></script>
</body>
</html>
