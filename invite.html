<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FBF6EE">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="SmartTable">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>คำเชิญเข้าร้าน · SmartTable</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet"></noscript>
  <link rel="stylesheet" href="css/st-style.css">
</head>
<body>
<main class="st-auth">
  <header class="st-brand">
    <svg viewBox="0 0 48 48" aria-hidden="true">
      <rect width="48" height="48" rx="14" fill="#E4572E"/>
      <circle cx="24" cy="25" r="11" fill="#fff"/>
      <circle cx="24" cy="25" r="6.5" fill="none" stroke="#E4572E" stroke-width="2"/>
      <rect x="9" y="8" width="7" height="7" rx="1.5" fill="#fff"/>
      <rect x="32" y="8" width="7" height="7" rx="1.5" fill="#fff"/>
    </svg>
    <div><h1>SmartTable</h1><p>คำเชิญเข้าร้าน</p></div>
  </header>

  <section class="st-card">
    <div id="st-msg" class="st-msg" role="status" hidden></div>
    <p data-step="loading" class="st-sub">กำลังโหลดคำเชิญ…</p>

    <div id="inv-card" hidden>
      <p class="st-sub" style="margin:0">คุณได้รับเชิญเป็น</p>
      <h2 id="inv-role" style="margin:2px 0"></h2>
      <p style="margin:0 0 4px">ที่ร้าน <b id="inv-shop"></b></p>
      <p class="st-sub">ส่งถึงอีเมล <b id="inv-email"></b></p>
    </div>

    <div data-step="guest" hidden>
      <p class="st-sub">เข้าสู่ระบบหรือสมัครด้วยอีเมลที่ร้านเชิญ แล้วจะกลับมาหน้านี้ให้กดรับคำเชิญ</p>
      <a id="go-login" class="st-btn st-btn-link" href="index.html">เข้าสู่ระบบ</a>
      <a id="go-signup" class="st-btn st-btn--ghost st-btn-link" href="index.html" style="margin-top:10px">ยังไม่มีบัญชี? สมัครสมาชิก</a>
    </div>

    <div data-step="user" hidden>
      <p class="st-sub">เข้าสู่ระบบอยู่ในชื่อ <b id="me-email"></b></p>
      <button id="btn-accept" class="st-btn" type="button">รับคำเชิญ</button>
      <button id="btn-switch" class="st-btn st-btn--ghost" type="button" style="margin-top:10px">เปลี่ยนบัญชี</button>
    </div>

    <div data-step="bad" hidden>
      <a class="st-btn st-btn--ghost st-btn-link" href="home.html">ไปหน้าร้านของฉัน</a>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/st-config.js"></script>
<script src="js/st-auth.js"></script>
<script src="js/st-invite.js"></script>
</body>
</html>
